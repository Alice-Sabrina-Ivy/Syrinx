name: Deploy to GitHub Pages

# Builds the site from main and deploys it with GitHub's Pages actions
# (repo Settings → Pages → Source: "GitHub Actions"). Replaced the old
# build-then-commit-docs/ loop, which committed ~24 MB of build output back
# to main on every merge and triggered GitHub's legacy "pages build and
# deployment" workflow twice per merge (one run always cancelled).

on:
  push:
    branches: [main]
    # Measurement notes and Markdown never change the built site (no unit
    # test reads them either), so a push touching only those skips the run.
    paths-ignore:
      - 'measurements/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A newer push to main supersedes a build that is still queued or
    # running, so an outdated main is never built and deployed first
    # (2026-10-05: during a runner outage a stale run sat ahead of the
    # merge that superseded it).
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # A broken main never reaches the live site.
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deployment at a time and never cancelled halfway; a newer deploy
    # waits, and GitHub drops an older one that is still waiting.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
