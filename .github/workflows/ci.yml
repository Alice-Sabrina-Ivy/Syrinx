name: CI

# Pull-request checks: the same lint + unit tests + build that gate the
# Pages deploy on main (deploy.yml), so a PR shows red before it merges.
# Corpus-scale oracles (npm run test:dsp, the session oracle, the noise
# oracle) need gitignored data and stay local — see CLAUDE.md.

on:
  pull_request:
    # Measurement notes and Markdown don't change the built site, so a push
    # touching only those skips the run. Exception: THIRD_PARTY_NOTICES.md is
    # the source of the shipped THIRD_PARTY_NOTICES.txt
    # (scripts/third-party-notices.mjs) and two unit tests read it
    # (tests/site/third-party-notices-test.js, tests/ml/heard-as-download-test.js),
    # so it always runs. GitHub applies `paths` patterns in order and the last
    # match wins: '**' includes everything, the two '!' lines drop
    # measurements and Markdown, and the final line re-includes the notices.
    # Keep THIRD_PARTY_NOTICES.md after the '!**/*.md' line, or it is skipped.
    # (tests/site/no-local-paths-test.js also scans Markdown; a Markdown-only
    # push is checked by the next run that does trigger.)
    paths:
      - '**'
      - '!measurements/**'
      - '!**/*.md'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
